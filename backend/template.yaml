AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  underdocks-v2-backend

Parameters:
  AzureApiKey:
    Type: String
    Description: Azure Document Intelligence API Key
    NoEcho: true
    Default: "YOUR_AZURE_API_KEY"

Globals:
  Function:
    Timeout: 15
    MemorySize: 1024
    Runtime: nodejs20.x
    Architectures:
      - arm64
    Environment:
      Variables:
        TABLE_NAME: !Ref UnderdocksInventoryV2

Resources:
  UnderdocksInventoryV2:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: UnderdocksInventoryV2
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  UnderdocksSalesV2:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: UnderdocksSalesV2
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  UnderdocksApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - "*"
        AllowMethods:
          - "*"

  GetItemsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/
      Handler: getItems.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UnderdocksInventoryV2
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref UnderdocksApi
            Path: /items
            Method: GET

  CreateItemFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/
      Handler: createItem.handler
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref UnderdocksInventoryV2
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref UnderdocksApi
            Path: /items
            Method: POST

  UpdateStockFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/
      Handler: updateStock.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UnderdocksInventoryV2
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref UnderdocksApi
            Path: /items/{id}/stock
            Method: PATCH

  DeleteItemFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/
      Handler: deleteItem.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UnderdocksInventoryV2
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref UnderdocksApi
            Path: /items/{id}
            Method: DELETE

  UpdateItemFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/
      Handler: updateItem.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UnderdocksInventoryV2
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref UnderdocksApi
            Path: /items/{id}/details
            Method: PATCH

  CheckInventoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/
      Handler: checkInventory.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UnderdocksInventoryV2
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref UnderdocksApi
            Path: /items/{id}/check
            Method: PATCH

  BatchCheckInventoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/
      Handler: batchCheckInventory.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UnderdocksInventoryV2
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref UnderdocksApi
            Path: /items/batch-check
            Method: PATCH

  BatchUpdateStockFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/
      Handler: batchUpdateStock.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UnderdocksInventoryV2
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref UnderdocksApi
            Path: /items/batch-update
            Method: PATCH

  ParseReceiptFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/
      Handler: parseReceipt.handler
      Environment:
        Variables:
          AZURE_ENDPOINT: "https://underdocks-ocr.cognitiveservices.azure.com/"
          AZURE_API_KEY: !Ref AzureApiKey
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref UnderdocksApi
            Path: /receipts/parse
            Method: POST

  SettingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/
      Handler: settings.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UnderdocksInventoryV2
      Events:
        ApiGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref UnderdocksApi
            Path: /settings
            Method: GET
        ApiPatch:
          Type: HttpApi
          Properties:
            ApiId: !Ref UnderdocksApi
            Path: /settings
            Method: PATCH

  GetSalesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/
      Handler: getSales.handler
      Environment:
        Variables:
          SALES_TABLE_NAME: !Ref UnderdocksSalesV2
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UnderdocksSalesV2
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref UnderdocksApi
            Path: /sales
            Method: GET

  SaveSaleFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/
      Handler: saveSale.handler
      Environment:
        Variables:
          SALES_TABLE_NAME: !Ref UnderdocksSalesV2
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UnderdocksSalesV2
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref UnderdocksApi
            Path: /sales
            Method: POST

Outputs:
  ApiEndpoint:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${UnderdocksApi}.execute-api.${AWS::Region}.amazonaws.com/"
